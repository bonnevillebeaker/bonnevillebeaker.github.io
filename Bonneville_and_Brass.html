<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonneville &amp; Brass — a little synthesizer</title>
<link rel="icon" type="image/svg+xml" href="musical_raven.svg">
<style>
  :root {
    --wood-dark: #2b1a12;
    --wood: #3d2518;
    --wood-light: #5a3826;
    --brass: #c9a24b;
    --brass-glow: #f2d47e;
    --ivory: #f4efe4;
    --ivory-shadow: #d8cfbb;
    --ebony: #1a130e;
    --felt: #7a1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, #6a4429 0%, transparent 55%),
      linear-gradient(160deg, #241610 0%, #160d08 100%);
    color: #e8ddc8;
    font-family: "Georgia", "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px 48px;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .brand-raven {
    width: clamp(48px, 9vw, 76px);
    height: auto;
    flex: 0 0 auto;
    background: radial-gradient(ellipse at center, rgba(242, 212, 126, 0.20), transparent 68%);
  }

  .brand-text { text-align: left; }

  h1 {
    font-weight: 400;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 0.02em;
    color: var(--brass-glow);
    text-shadow: 0 1px 0 #00000066;
  }

  h1 .amp { color: #8f6b2e; font-style: italic; padding: 0 0.15em; }

  .sub {
    margin-top: 6px;
    font-size: 0.85rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #9c8663;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 26px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .ctrl {
    background: linear-gradient(180deg, #4a2f1e, #331f13);
    border: 1px solid #6a4a2f;
    color: #e2cfa4;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: inset 0 1px 0 #ffffff1a, 0 2px 4px #0006;
  }
  .ctrl:hover { border-color: var(--brass); color: var(--brass-glow); }
  .ctrl:focus-visible { outline: 2px solid var(--brass-glow); outline-offset: 2px; }
  .ctrl:disabled {
    opacity: 0.42;
    cursor: not-allowed;
    border-color: #59402b;
    color: #9a896a;
  }
  .ctrl:disabled:hover { border-color: #59402b; color: #9a896a; }
  .ctrl[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--brass), #a07d30);
    color: #2b1a12;
    border-color: var(--brass-glow);
    box-shadow: inset 0 1px 2px #fff5, 0 0 12px #f2d47e55;
  }

  /* the piano cabinet */
  .piano {
    background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 40%, var(--wood-dark) 100%);
    padding: 18px 18px 24px;
    border-radius: 14px;
    box-shadow:
      inset 0 2px 4px #ffffff22,
      inset 0 -6px 16px #00000088,
      0 24px 48px #000000aa;
    border: 1px solid #6a4a2f;
    max-width: 100%;
  }

  /* the felt strip is also the draggable piano-range navigator */
  .felt {
    position: relative;
    height: 12px;
    border-radius: 5px;
    background: linear-gradient(180deg, #2b1813, #1b100d);
    border: 1px solid #5c3528;
    box-shadow: inset 0 2px 4px #00000088, 0 1px 0 #ffffff10;
    margin-bottom: 12px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  .felt.dragging { cursor: grabbing; }
  .felt:focus-visible {
    outline: 2px solid var(--brass-glow);
    outline-offset: 3px;
  }
  .felt-thumb {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    min-width: 36px;
    border-radius: 4px;
    background: linear-gradient(180deg, #a53232, var(--felt));
    box-shadow: inset 0 2px 3px #ffffff16, inset 0 -2px 4px #00000055, 0 0 7px #7a1f1f44;
    border-right: 1px solid #b54a4a55;
    border-left: 1px solid #b54a4a55;
    pointer-events: none;
  }

  .keys {
    position: relative;
    display: flex;
    width: min(528px, calc(100vw - 68px));
    height: 220px;
    user-select: none;
    touch-action: none;
    overflow: hidden;
  }

  .key {
    position: relative;
    cursor: pointer;
    pointer-events: auto;
  }

  .key.white {
    flex: 1 1 0;
    background: linear-gradient(180deg, var(--ivory) 0%, #ece4d3 92%, var(--ivory-shadow) 100%);
    border: 1px solid #b9ad93;
    border-radius: 0 0 6px 6px;
    box-shadow: inset 0 -6px 8px #00000018, inset -2px 0 3px #00000010;
    z-index: 1;
  }

  .key.black {
    position: absolute;
    top: 0;
    left: var(--black-left, 0%);
    width: 5.67%;
    height: 64%;
    transform: translateX(-50%);
    background:
      linear-gradient(90deg, #0b0806 0%, transparent 16%, transparent 84%, #070504 100%),
      linear-gradient(180deg, #352a22 0%, #201914 16%, #15100d 72%, #0c0907 100%);
    border: 1px solid #080604;
    border-top-color: #3e3026;
    border-radius: 2px 2px 6px 6px;
    box-shadow:
      inset 2px 0 2px #ffffff0d,
      inset -2px 0 2px #00000088,
      inset 0 -8px 10px #000000b3,
      0 5px 7px #000000b8;
    z-index: 3;
  }

  .key.black::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 5px;
    top: 4px;
    height: 34%;
    border-radius: 2px 2px 10px 10px;
    background: linear-gradient(180deg, #ffffff18, #ffffff00);
    pointer-events: none;
  }

  .key.active.white {
    background: linear-gradient(180deg, #efe6d0 0%, #ddd0b2 100%);
    box-shadow: inset 0 4px 10px #00000030;
    transform: translateY(1px);
  }
  .key.active.black {
    background:
      linear-gradient(90deg, #0b0806 0%, transparent 16%, transparent 84%, #070504 100%),
      linear-gradient(180deg, #403329 0%, #211914 55%, #100c09 100%);
    box-shadow: inset 0 5px 9px #000000cc, 0 2px 3px #000000aa, 0 0 9px #f2d47e44;
    transform: translateX(-50%) translateY(2px);
  }

  .label {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.68rem;
    color: #a89a7d;
    pointer-events: none;
    line-height: 1.05;
  }
  .keybind {
    font-weight: 800;
    font-size: 0.78rem;
    color: #5d4a2f;
    letter-spacing: 0.01em;
  }
  .note-name {
    font-weight: 400;
  }
  .key.black .label { color: #b7a47c; bottom: 6px; }
  .key.black .keybind { color: #f0d99a; }

  .volume-control,
  .reverb-control {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 220px;
    cursor: default;
  }
  .volume-control span,
  .reverb-control span {
    min-width: 76px;
    text-align: right;
    white-space: nowrap;
  }
  .volume-control input[type="range"],
  .reverb-control input[type="range"] {
    width: 120px;
    accent-color: var(--brass);
    cursor: pointer;
  }
  .volume-control input[type="range"]:focus-visible,
  .reverb-control input[type="range"]:focus-visible {
    outline: 2px solid var(--brass-glow);
    outline-offset: 3px;
    border-radius: 8px;
  }

  .instrument-control {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: default;
  }
  .instrument-control span {
    white-space: nowrap;
  }
  .instrument-control select {
    appearance: none;
    -webkit-appearance: none;
    background: #2f1d12;
    color: #e2cfa4;
    border: 1px solid #6a4a2f;
    border-radius: 12px;
    padding: 5px 28px 5px 10px;
    font: inherit;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, #c9a24b 50%),
      linear-gradient(135deg, #c9a24b 50%, transparent 50%);
    background-position:
      calc(100% - 13px) 50%,
      calc(100% - 9px) 50%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .instrument-control select:focus-visible {
    outline: 2px solid var(--brass-glow);
    outline-offset: 2px;
  }

  #importSound { display: inline-flex; align-items: center; gap: 6px; }

  /* ---- import dialog ---- */
  .import-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(10, 6, 3, 0.74);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .import-overlay[hidden] { display: none; }
  .import-dialog {
    width: min(880px, 96vw); max-height: 92vh; overflow-y: auto;
    background: linear-gradient(180deg, #3a2416, #241610);
    border: 1px solid var(--brass); border-radius: 18px;
    box-shadow: 0 24px 60px #000a, inset 0 1px 0 #ffffff14;
    padding: 20px 22px 18px; color: #e8ddc8;
  }
  .import-head { display: flex; align-items: center; justify-content: space-between; }
  .import-head h2 { font-size: 1.15rem; color: var(--brass-glow); font-weight: 700; letter-spacing: 0.02em; }
  .import-x { background: none; border: none; color: #c8b083; font-size: 1.7rem; line-height: 1; cursor: pointer; padding: 0 4px; }
  .import-x:hover { color: var(--brass-glow); }
  .import-sub {
    font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.78rem; color: #c8b083;
    margin: 2px 0 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .import-section { margin-bottom: 14px; }
  .import-label {
    font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.72rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: #b89a68; margin-bottom: 6px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .import-hint { text-transform: none; letter-spacing: 0.01em; font-size: 0.72rem; color: #8f7a55; font-style: italic; }
  .import-hint.cap { color: #e8a05a; font-style: normal; }
  .import-canvas {
    width: 100%; height: 148px; display: block; border-radius: 10px;
    border: 1px solid #5a3f28; background: #140d08; touch-action: none;
  }
  .import-canvas.wave { cursor: ew-resize; }
  .import-canvas.spectrum { cursor: crosshair; }
  .import-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; margin: 8px 0 16px; }
  .import-field { display: flex; flex-direction: column; gap: 5px; }
  .import-field label {
    font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.7rem; letter-spacing: 0.05em;
    text-transform: uppercase; color: #b89a68;
  }
  .import-inline { display: flex; align-items: center; gap: 8px; }
  .import-inline input[type="number"], .import-field select {
    background: #2f1d12; color: #e2cfa4; border: 1px solid #6a4a2f; border-radius: 10px;
    padding: 6px 9px; font: inherit; font-size: 0.9rem;
  }
  .import-inline input[type="number"] { width: 92px; }
  .import-field select { cursor: pointer; }
  .import-inline input:focus-visible, .import-field select:focus-visible {
    outline: 2px solid var(--brass-glow); outline-offset: 2px;
  }
  .import-unit { color: #b89a68; font-size: 0.82rem; }
  .import-note { color: var(--brass-glow); font-weight: 700; font-size: 0.9rem; min-width: 74px; }
  .import-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
  .import-actions-right { display: flex; gap: 10px; }
  .import-primary { background: linear-gradient(180deg, var(--brass), #a07d30); color: #2b1a12; border-color: var(--brass-glow); font-weight: 700; }
  .import-primary:hover { color: #2b1a12; border-color: var(--brass-glow); }
  @media (max-width: 560px) { .import-row { gap: 12px; } .import-note { min-width: 0; } }

  .loop-status[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--brass), #a07d30);
    color: #2b1a12;
    border-color: var(--brass-glow);
    box-shadow: inset 0 1px 2px #fff5, 0 0 12px #f2d47e55;
  }

  .timing-editor {
    width: min(566px, calc(100vw - 32px));
    margin-top: 16px;
    padding: 14px 16px 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, #422a1a, #2d1b11);
    border: 1px solid #6a4a2f;
    box-shadow: inset 0 1px 0 #ffffff12, 0 5px 12px #0005;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .timing-editor.disabled { opacity: 0.48; }
  .timing-title {
    margin-bottom: 12px;
    font-size: 0.74rem;
    color: #d8c298;
    text-align: left;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .timing-slider-control {
    display: block;
    width: 100%;
  }
  .timing-slider-control + .timing-slider-control {
    margin-top: 16px;
  }
  .timing-slider-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
  }
  .timing-slider-label {
    font-size: 0.72rem;
    color: #bca77f;
    letter-spacing: 0.03em;
  }
  .timing-slider-value {
    font-size: 0.76rem;
    color: #f2d47e;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .timing-slider {
    width: 100%;
    height: 30px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    cursor: ew-resize;
  }
  .timing-slider::-webkit-slider-runnable-track {
    height: 7px;
    border-radius: 999px;
    background: linear-gradient(90deg, #725233 0%, #c9a24b 50%, #725233 100%);
    border: 1px solid #8a6338;
    box-shadow: inset 0 1px 3px #0009;
  }
  .timing-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    margin-top: -8px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f2d47e, #b48b39);
    border: 2px solid #4b301d;
    box-shadow: 0 2px 6px #0009, inset 0 1px 1px #fff7;
  }
  .timing-slider::-moz-range-track {
    height: 7px;
    border-radius: 999px;
    background: linear-gradient(90deg, #725233 0%, #c9a24b 50%, #725233 100%);
    border: 1px solid #8a6338;
    box-shadow: inset 0 1px 3px #0009;
  }
  .timing-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f2d47e, #b48b39);
    border: 2px solid #4b301d;
    box-shadow: 0 2px 6px #0009, inset 0 1px 1px #fff7;
  }
  .timing-slider:focus-visible {
    outline: 2px solid var(--brass-glow);
    outline-offset: 3px;
    border-radius: 8px;
  }
  .timing-slider:disabled { cursor: not-allowed; }

  @media (max-width: 560px) {
    .keys { height: 180px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand-row">
      <img class="brand-raven" src="musical_raven.svg" alt="Bonneville &amp; Brass raven mascot">
      <div class="brand-text">
        <h1>Bonneville <span class="amp">&amp;</span> Brass</h1>
        <div class="sub">a little synthesizer</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <label class="ctrl instrument-control" for="instrument">
      <span>Instrument</span>
      <select id="instrument" aria-label="Instrument">
        <option value="warm">Warm Keys</option>
        <option value="piano">Piano</option>
        <option value="harpsichord">Harpsichord</option>
        <option value="epiano">Electric Piano</option>
        <option value="organ">Organ</option>
        <option value="pad">Soft Pad</option>
        <option value="chip">8-bit</option>
        <option value="custom" id="customOption" disabled>Your sound &#10022;</option>
      </select>
    </label>
    <button class="ctrl" id="importSound" type="button" aria-label="Import a sound to use as an instrument">Import sound &#10549;</button>
    <input type="file" id="sampleFile" accept="audio/*" hidden>
    <label class="ctrl volume-control" for="volume">
      <span id="volumeLabel">Volume 75%</span>
      <input id="volume" type="range" min="0" max="100" step="1" value="75" aria-label="Volume">
    </label>
    <label class="ctrl reverb-control" for="reverb">
      <span id="reverbLabel">Reverb 15%</span>
      <input id="reverb" type="range" min="0" max="100" step="1" value="15" aria-label="Reverb">
    </label>
    <button class="ctrl loop-status" id="loop" aria-pressed="false">Loop pedal</button>
    <button class="ctrl" id="saveRecording" disabled>Save recording</button>
    <button class="ctrl" id="pauseLoops" disabled>Pause loops</button>
    <button class="ctrl" id="clearLastLoop" disabled>Clear last loop</button>
    <button class="ctrl" id="clearLoops" disabled>Clear loops</button>
    <button class="ctrl" id="octaveDown">Octave &#9660;</button>
    <button class="ctrl" id="octaveUp">Octave &#9650;</button>
  </div>

  <div class="piano">
    <div class="felt" id="pianoNavigator" role="slider" tabindex="0" aria-label="Slide piano view" aria-valuemin="21" aria-valuemax="85" aria-valuenow="60">
      <div class="felt-thumb" id="pianoNavigatorThumb"></div>
    </div>
    <div class="keys" id="keys"></div>
  </div>

  <div class="timing-editor disabled" id="timingEditor" aria-label="Timing for last loop layer">
    <div class="timing-title">Last loop timing — 0.01 second precision</div>
    <label class="timing-slider-control" for="startAdjust">
      <span class="timing-slider-head">
        <span class="timing-slider-label">Beginning: trim ← 0 → add silence</span>
        <span class="timing-slider-value" id="startAdjustValue">0.00 s</span>
      </span>
      <input class="timing-slider" id="startAdjust" type="range" min="-10" max="10" step="0.01" value="0" disabled aria-label="Adjust beginning of last loop in hundredths of a second">
    </label>
    <label class="timing-slider-control" for="endAdjust">
      <span class="timing-slider-head">
        <span class="timing-slider-label">End: trim ← 0 → add silence</span>
        <span class="timing-slider-value" id="endAdjustValue">0.00 s</span>
      </span>
      <input class="timing-slider" id="endAdjust" type="range" min="-10" max="10" step="0.01" value="0" disabled aria-label="Adjust end of last loop in hundredths of a second">
    </label>
  </div>

  <div class="import-overlay" id="importOverlay" hidden>
    <div class="import-dialog" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="import-head">
        <h2 id="importTitle">Import a sound</h2>
        <button class="import-x" id="importCancelX" type="button" aria-label="Cancel import">&times;</button>
      </div>
      <p class="import-sub" id="importFileName">&mdash;</p>

      <div class="import-section">
        <div class="import-label">Frequency content
          <span class="import-hint">click the spectrum to set the tuning reference</span>
        </div>
        <canvas id="spectrumCanvas" class="import-canvas spectrum" width="820" height="148"></canvas>
      </div>

      <div class="import-section">
        <div class="import-label">Clip window
          <span class="import-hint" id="selDurLabel">&mdash;</span>
        </div>
        <canvas id="waveCanvas" class="import-canvas wave" width="820" height="148"></canvas>
      </div>

      <div class="import-row">
        <div class="import-field">
          <label for="refHz">Tuned to</label>
          <div class="import-inline">
            <input id="refHz" type="number" min="20" max="8000" step="0.1" value="440">
            <span class="import-unit">Hz</span>
            <span class="import-note" id="refNote">A4</span>
          </div>
        </div>
        <div class="import-field">
          <label for="refNoteSelect">Snap to note</label>
          <select id="refNoteSelect"></select>
        </div>
        <button class="ctrl" id="autoDetectBtn" type="button">Auto-detect peak</button>
      </div>

      <div class="import-actions">
        <button class="ctrl" id="previewBtn" type="button">&#9654; Preview window</button>
        <div class="import-actions-right">
          <button class="ctrl" id="importCancel" type="button">Cancel</button>
          <button class="ctrl import-primary" id="importConfirm" type="button">Use this sound</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---- audio engine -------------------------------------------------
  let audioCtx = null;
  let mixBus = null;
  let liveBus = null;
  let volume = 0.75;
  let reverb = 0.15;
  let currentInstrument = "warm";
  let customSample = null; // { buffer, baseFreq, loopStart, loopEnd, duration, oneShot } for imported sound
  let importModalOpen = false; // true while the import dialog is up
  const activeVoices = {}; // voice id -> { osc[], gain, midi, release }
  const loopLayerBuses = new Map();

  const INSTRUMENTS = {
    warm: {
      attack: 0.008, decay: 0.35, peak: 0.50, sustain: 0.18, release: 0.28,
      sources: [
        { type: "triangle", ratio: 1, gain: 1.00, detune: 0 },
        { type: "sine", ratio: 1, gain: 0.35, detune: -4 }
      ]
    },
    piano: {
      attack: 0.004, decay: 0.50, peak: 0.62, sustain: 0.075, release: 0.22,
      sources: [

      filter: { type: "lowpass", frequency: 1550, q: 0.65 },
      sources: [
        { type: "sawtooth", ratio: 1, gain: 0.44, detune: -7 },
        { type: "sawtooth", ratio: 1, gain: 0.44, detune: 7 },

    },

      attack: 0.006, decay: 0.16, peak: 0.9, sustain: 0.78, release: 0.32,
